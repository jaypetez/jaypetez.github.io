# Test, build, and deploy the site.
#
# One workflow on purpose: the `deploy` job declares `needs: [test, build]`, so a
# deployment is structurally impossible unless the whole suite is green. `test`
# and `build` are also the two contexts the `main` branch ruleset requires.
#
# Every action is pinned to a commit SHA rather than a mutable tag; the trailing
# comment records the version Dependabot will bump.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level; the deploy job opts into the extra scopes a
# Pages deployment needs.
permissions:
  contents: read

# Allow one deployment at a time, and never cancel one midway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Astro 7 requires >=22.12; this is the version the build and deploy use.
  NODE_VERSION: '22.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current LTS plus the next line, so an upgrade breaks here and not in
        # the deploy job.
        node: ['22.x', '24.x']
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Installing from the npm registry needs egress, so audit rather than block.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types and templates
        run: npm run check

      - name: Unit, component, content, and design-token tests
        run: npm run coverage

      - name: Upload coverage
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        # Emits the base path Astro would need for a project site. This is a user
        # site served from the domain root, so nothing changes here — the step is
        # kept because the deploy job's artifact contract expects it.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: npm run build

      - name: Assert the built output
        # Links, axe, the HTML contract, and the JavaScript budget — run against
        # dist/ before the artifact is uploaded, so a regression fails the job.
        run: npm run test:built

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: [test, build]
    # Only a real push to main deploys. Pull requests get the full test and build
    # signal without touching production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token the deploy step verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
